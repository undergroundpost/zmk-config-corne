---
include:
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: corne_dongle
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_ble_settings_reset
  # Second Corne: no dongle, no displays. The left half is the central.
  - board: nice_nano//zmk
    shield: corne_left
    artifact-name: corne_left_standalone
  - board: nice_nano//zmk
    shield: corne_right
    artifact-name: corne_right_nodisplay
